[project]
name = "postgres"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "psycopg-pool>=3.2.4,<4.0.0",
    "psycopg[binary]>=3.2.1,<4.0.0",
    "typing-extensions>=4.14.1,<5.0.0",
]


[dependency-groups]
dev = [
    "black==25.12.0",
    "isort==7.0.0",
]


[tool.setuptools.dynamic]
version = {attr = "postgres.__version__"}


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.isort]
profile = "black"
extend_skip_glob = []
skip_gitignore = true
line_length = 120
atomic = true
lines_after_imports = 2
combine_as_imports = true
force_sort_within_sections = true
color_output = true


[tool.black]
line-length = 120
extend-exclude = '''
(
  .venv
)
'''